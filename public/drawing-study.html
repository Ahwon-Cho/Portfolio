<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Coffee drawings · Ahwon Cho</title>
  <link rel="icon" href="/ahwon-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #252b2b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1200px; margin: auto; padding: 32px 40px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1 { font-weight: 500; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.04em; margin: 7px 0 9px; }
    p { margin: 0; font-size: 16px; line-height: 1.5; color: #58605e; }
    .eyebrow { font-size: 14px; color: #5f6966; }
    header a { display: flex; align-items: center; min-height: 44px; color: #35483f; font-size: 14px; text-underline-offset: 5px; white-space: nowrap; }
    header nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .drawings { display: grid; grid-template-columns: 1.15fr .8fr .6fr; grid-template-rows: 310px 290px; gap: 20px 24px; }
    figure { margin: 0; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #e5e8e5; }
    figure a { min-height: 0; flex: 1; display: flex; justify-content: center; padding: 16px 10px 12px; }
    figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
    figcaption { display: flex; gap: 12px; padding: 10px 0; color: #3d4742; font-size: 14px; line-height: 1.4; }
    figcaption span { color: #68726c; font-size: 12px; padding-top: 2px; }
    .person { grid-column: 1; grid-row: 1 / 3; }
    .table { grid-column: 2 / 4; grid-row: 1; }
    .chair { grid-column: 2; grid-row: 2; }
    .mug { grid-column: 3; grid-row: 2; }
    .mug a { align-items: center; }
    .mug img { max-width: 145px; height: auto; }
    a:focus-visible { outline: 2px solid #344c86; outline-offset: 5px; }
    footer { font-size: 14px; line-height: 1.5; color: #68726c; margin-top: 26px; }
    @media (min-width: 900px) and (min-height: 900px) { .drawings { grid-template-rows: 350px 330px; } }
    @media (max-width: 650px) {
      main { padding: 24px 20px; }
      header { align-items: start; flex-direction: column; gap: 8px; }
      .drawings { grid-template-columns: 1fr 1fr; grid-template-rows: 540px 270px 250px; gap: 16px; }
      .person { grid-column: 1 / 3; grid-row: 1; }
      .table { grid-column: 1 / 3; grid-row: 2; }
      .chair { grid-column: 1; grid-row: 3; }
      .mug { grid-column: 2; grid-row: 3; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Ahwon Cho · Drawing study</p><h1>Coffee, piece by piece.</h1><p>From your selected illustration. Four separate pieces.</p></div>
      <nav aria-label="Drawing study links"><a href="/images/painted-motion/coffee-study-v3/selected-reference.png">Selected reference</a><a href="/ink-motion">Back to the scene</a></nav>
    </header>
    <section class="drawings" aria-label="Individual coffee-scene drawings">
      <figure class="person"><a href="/images/painted-motion/coffee-study-v3/ahwon-seated.png" aria-label="Open the full-body Ahwon drawing"><img src="/images/painted-motion/coffee-study-v3/ahwon-seated.png" alt="Rounded painted character with long dark hair, simple oval eyes, a green hoodie, tan trousers and complete ivory sneakers, seated with empty hands near her chest."></a><figcaption><span>01</span>Ahwon · seated</figcaption></figure>
      <figure class="table"><a href="/images/painted-motion/coffee-study-v3/pedestal-table.png" aria-label="Open the table drawing"><img src="/images/painted-motion/coffee-study-v3/pedestal-table.png" alt="A round ivory cafe table with dense pale brush marks and a broad light-gray pedestal."></a><figcaption><span>02</span>Round table</figcaption></figure>
      <figure class="chair"><a href="/images/painted-motion/coffee-study-v3/cafe-chair.png" aria-label="Open the chair drawing"><img src="/images/painted-motion/coffee-study-v3/cafe-chair.png" alt="A simple complete ivory cafe chair painted with soft irregular brush strokes."></a><figcaption><span>03</span>Cafe chair</figcaption></figure>
      <figure class="mug"><a href="/images/painted-motion/coffee-study-v3/red-mug.png" aria-label="Open the red mug drawing"><img src="/images/painted-motion/coffee-study-v3/red-mug.png" alt="A traditional brick-red mug with a right-side handle and matte dry-brush texture."></a><figcaption><span>04</span>Red mug</figcaption></figure>
    </section>
    <footer>Select a drawing to inspect it at full size. These are white-background art drafts, not finished animation cutouts.</footer>
  </main>
</body>
</html>
